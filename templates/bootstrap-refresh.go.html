{{define "bootstrap-refresh"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <title>NFARL Field Day {{.Year}}</title>
    <!-- Tailwind is included in header template -->
</head>

<body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto p-4">
        {{template "header"}}
        {{template "content" .}}
        {{template "footer" .}}
    </div>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        var audio = document.querySelector("audio");
        if (audio) {
            audio.addEventListener("ended", function() {
                window.location.href = "/new";
            });
        } else {
            // If no audio, fallback to a timeout (e.g., 5 seconds)
            setTimeout(function() {
                window.location.href = "/new";
            }, 5000);
        }
    });
    </script>
</body>

</html>
{{end}}

{{template "bootstrap-refresh" .}}
